[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hipequivariance"
version = "0.1.0"
description = "Zero-code-change cuequivariance_ops_torch shim for AMD ROCm, backed by geometric-nn-ops Triton kernels."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
authors = [{ name = "Advanced Micro Devices, Inc." }]
keywords = ["triton", "rocm", "hip", "amd", "alphafold", "openfold", "cuequivariance"]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]

dependencies = [
    "geometric-nn-ops",
    "torch>=2.4",
]

[project.optional-dependencies]
test = [
    "pytest>=7",
    "cuequivariance==0.9.1",
    "cuequivariance-torch==0.9.1",
]

[project.urls]
"Source" = "https://github.com/AMDResearch/geometric-nn-ops"

[tool.hatch.build.targets.wheel]
packages = ["cuequivariance_ops_torch"]

[tool.pytest.ini_options]
testpaths = ["tests"]
