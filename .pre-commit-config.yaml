# Run `pre-commit install` once to enable these hooks on `git commit`.
# Config lives in pyproject.toml ([tool.ruff]).
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Keep in sync with the ruff pin in pyproject.toml ([project.optional-dependencies] dev).
    rev: v0.14.2
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
