name: Tests

on:
  # Not push+pull_request because then it runs twice for PRs from branches
  # within the repo.
  pull_request:
  push:
    branches: [main]

# head_ref is set only for pull requests, so a new push to a PR cancels the
# previous run. Pushes to main fall back to the unique run_id and so never
# cancel each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pytest-cpu:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          # Oldest supported Python version, whereas GPU job uses newest. Some
          # expanded coverage at the cost of more variables changing at once.
          python-version: "3.10"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            hipequivariance_ops_torch/pyproject.toml

      - name: Install
        run: |
          python -m pip install --only-binary=":all:" "torch==2.4.0+cpu" --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --only-binary=":all:" -e ".[test]" -e "./hipequivariance_ops_torch[test]"

      # Runners have no GPU, so most tests skip and this is mainly a check that
      # every module still imports and collects.
      - name: Run CPU-only tests
        run: python -m pytest -m "" -vrxs tests hipequivariance_ops_torch/tests


  pytest-gpu:
    # Requires a self-hosted ROCm GPU runner. Set the GPU_RUNNER_LABEL
    # repository variable to that runner's label to enable this job.
    if: ${{ vars.GPU_RUNNER_LABEL != '' }}
    runs-on: ${{ vars.GPU_RUNNER_LABEL }}
    container:
      # rocm10.0_ubuntu26.04_py3.14_pytorch_release_2.13.0
      image: rocm/pytorch@sha256:3174cb7061d94c427da96c0edef4adea28046fa3f3b2ff3948dc4e995665ff8c
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # No setup-python: the image ships 3.14 with torch in a venv on PATH.
      - name: Install
        run: python -m pip install --only-binary=":all:" -e ".[test]" -e "./hipequivariance_ops_torch[test]"

      - name: Show torch build
        run: python -c 'import torch; print(f"{torch.__version__=}, {torch.cuda.is_available()=}, {torch.cuda.device_count()=}, {torch.version.hip=}, {torch.cuda.get_arch_list()=}")'

      - name: Run GPU tests
        # -m "" includes the large tests that are excluded by default
        run: python -m pytest -m "" -vrxs tests hipequivariance_ops_torch/tests
