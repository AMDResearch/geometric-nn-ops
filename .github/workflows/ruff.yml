name: Lint

on:
  # Not push+pull_request because then it runs twice for PRs from branches
  # within the repo.
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ruff:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Lint with ruff
        uses: astral-sh/ruff-action@278981a28ce3188b1e39527901f38254bf3aac89 # v4.1.0
        with:
          version-file: pyproject.toml

      - name: Check formatting with ruff
        # Run even when the lint step fails to avoid multiple round trips.
        if: ${{ !cancelled() }}
        uses: astral-sh/ruff-action@278981a28ce3188b1e39527901f38254bf3aac89 # v4.1.0
        with:
          version-file: pyproject.toml
          args: format --check
