[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "geometric-nn-ops-torch"
version = "0.1.0"
description = "Vendor-neutral GPU kernels for geometry-aware neural nets (triangle/folding ops)"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
authors = [{ name = "Advanced Micro Devices, Inc." }]
keywords = ["triton", "rocm", "hip", "amd", "attention", "alphafold", "openfold"]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]

dependencies = [
    "torch>=2.4",
    "triton>=3.0",
]

[project.optional-dependencies]
test = ["pytest>=7", "pytest-cov>=6"]
# Keep the ruff pin in sync with `rev` in .pre-commit-config.yaml so the hook
# and manual runs format identically (ruff is pre-1.0; output can shift).
dev = ["ruff==0.16.3", "pre-commit"]

[tool.pytest.ini_options]
markers = [
    "large: tests of large inputs. These require significant memory and take a long time.",
]
# Large tests are generally not appropriate for local runs, as they can require
# datacenter-class GPU memory and be extremely slow otherwise. They are
# deselected by default; opt in with `-m large` or `-m ""`. Tests with specific
# memory requirements also skip if the GPU has insufficient memory.
addopts = "-m 'not large'"

[tool.coverage.run]
source_pkgs = ["geometric_nn_ops_torch"]
# PEP 669 monitoring. Torch runs autograd backward on C++-owned threads that
# `threading.settrace` never reaches, so the default tracer reports every
# `autograd.Function.backward` as dead code even though the tests exercise it
# thoroughly. `sysmon` is interpreter-global and sees them.
core = "sysmon"
# No `branch = true`: `sysmon` cannot measure branches before Python 3.14, and
# setting both makes coverage.py fall back to the default core, losing the
# above.
relative_files = true

[tool.coverage.report]
show_missing = true
precision = 1
exclude_also = [
    # We measure host code only. `@triton.jit` bodies are parsed to an AST and
    # compiled to GPU code, so they never run as CPython bytecode and the tracer
    # records nothing for them.
    "@triton\\.jit",
    # Reachable only with Triton absent, which the test environment cannot
    # arrange while also running any of the kernels.
    "except ImportError:",
]

[project.urls]
"Source" = "https://github.com/AMDResearch/geometric-nn-ops"

[tool.hatch.build.targets.wheel]
packages = ["geometric_nn_ops_torch"]

[tool.ruff]
line-length = 88  # Black/ruff default
# Lowest supported interpreter (matches requires-python). Keeps pyupgrade (UP)
# from rewriting to syntax newer than 3.10.
target-version = "py310"

[tool.ruff.lint]
# Required for CPY001 (flake8-copyright), which is still a preview rule. Preview
# also enables preview behavior of the other selected rules; kept deterministic
# by the pinned ruff version above.
preview = true
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort (import sorting)
    "UP",     # pyupgrade (modern type-hint syntax, etc.)
    "B",      # flake8-bugbear
    "SIM",    # flake8-simplify
    "TID",    # flake8-tidy-imports (TID251 bans `from __future__ import annotations`)
    "CPY001", # flake8-copyright (require a copyright + SPDX license header)
]
ignore = [
    # Ambiguous single-char names (l/I/O). Kernel math uses e.g. `O` for the
    # attention output tensor by convention.
    "E741",
    # Allow explicit if/else where it reads better than a ternary.
    "SIM108",
]
# Let `ruff check --fix` apply the modern-type-hint rewrites (List->list,
# Optional[X]->X | None, Union->|); these are unsafe-by-default.
extend-safe-fixes = ["UP006", "UP007", "UP045"]

[tool.ruff.lint.flake8-copyright]
# Require an AMD copyright line directly followed by an Apache-2.0 SPDX
# identifier. Matched anywhere near the top, so files copied from elsewhere can
# keep their original notices above this block:
#
#     # Copyright Advanced Micro Devices, Inc.
#     # SPDX-License-Identifier: Apache-2.0
notice-rgx = '(?im)^# Copyright.*Advanced Micro Devices.*\n# SPDX-License-Identifier: Apache-2\.0'

[tool.ruff.lint.flake8-tidy-imports.banned-api]
# Ban `from __future__ import annotations`. PEP 649/749 (Python 3.14) make it
# unnecessary, it is on a deprecation path, and it breaks runtime annotation
# introspection (dataclasses / typing.get_type_hints).
"__future__.annotations".msg = "`from __future__ import annotations` is no longer recommended and is on a deprecation path; PEP 649/749 (Python 3.14) supersede it."

[tool.ruff.lint.isort]
# `utils` is `tests/utils.py`, which pytest makes importable by putting the test
# directory on sys.path. Without this it sorts as a third-party package.
known-first-party = ["geometric_nn_ops_torch", "testutil", "utils"]
