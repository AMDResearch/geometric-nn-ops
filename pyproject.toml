[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "geometric-nn-ops"
version = "0.1.0"
description = "Vendor-neutral GPU kernels for geometry-aware neural nets (triangle/folding ops)"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
authors = [{ name = "Advanced Micro Devices, Inc." }]
keywords = ["triton", "rocm", "hip", "amd", "attention", "alphafold", "openfold"]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]

dependencies = [
    "torch>=2.4",
    "triton>=3.0",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.urls]
"Source" = "https://github.com/AMDResearch/geometric-nn-ops"

[tool.setuptools.packages.find]
include = ["geometric_nn_ops*"]
